{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Сервис аудиокниг{% endblock %}</title>
    
    <!-- Bootstrap -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    
    <link rel="stylesheet" href="{% static 'homepage/css/style.css' %}">
</head>
<body class="bg-light d-flex flex-column min-vh-100">

    <div class="container mt-3">
        <img src="{% static 'homepage/img/logo.jpg' %}" alt="Логотип" class="app-logo">
    </div>

    {% include "includes/navigation.html" %}

    <main class="container flex-grow-1">
        {% block content %}
        {% endblock %}
    </main>

    <footer class="container mt-4 mb-3 text-muted">
        <hr>
        <p>© <span id="current-year"></span> Сервис аудиокниг</p>
    </footer>

    <!-- JS -->
    <script src="{% static 'homepage/js/main.js' %}"></script>
</body>
</html>
