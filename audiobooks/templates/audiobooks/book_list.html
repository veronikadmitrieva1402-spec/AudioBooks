{% extends "base.html" %}

{% block title %}Коллекция книг{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h1>Коллекция аудиокниг</h1>
    <span class="badge bg-secondary fs-6">Всего: {{ books|length }}</span>
</div>

<div class="row">
    {% for book in books %}
        {% include "audiobooks/includes/book_card.html" %}
    {% empty %}
        <div class="col-12">
            <div class="alert alert-info">В коллекции пока нет книг.</div>
        </div>
    {% endfor %}
</div>
{% endblock %}
