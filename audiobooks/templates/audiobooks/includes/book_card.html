<div class="col-md-6 mb-4">
    <article class="card book-card shadow-sm h-100">
        <div class="card-body">
            <h5 class="card-title">
                {{ book.title|default:"Без названия" }}
            </h5>
            <h6 class="card-subtitle mb-2 text-muted">{{ book.author }}</h6>
            <p class="card-text small">
                Чтец: {{ book.narrator }} <br>
                Жанр: {{ book.genre }}
            </p>
            <a href="{% url 'books:detail' book.id %}" class="btn btn-sm btn-primary">
                Подробнее
            </a>
        </div>
    </article>
</div>
